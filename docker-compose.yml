# Local development compose file (ADR-026, ARCH-025 §4, ADR-027).
#
# One app per runtime (ADR-027): api-go (all four Go services) and api-ts
# (all thirteen TypeScript services, currently a routing shell). Run the
# whole backend from this one file:
#
#   podman compose up --build    (or: docker compose up --build)
#
# Every app builds from its own Dockerfile with the repo root as build
# context and publishes its dev port (see each app's .env.example), not the
# fixed 8080 the Kubernetes chart (infra/helm/service) uses internally.
#
# NATS (JetStream) is real and shared -- api-go's NATS_URL points at it,
# matching its AuditEmitter/eventbus wiring (ADR-023). Postgres is real too:
# one database per app (ADR-028) -- api_go and api_ts, created by
# infra/compose/postgres-init.sql. api-go migrates itself at boot
# (db/migrations via ADR-029); api-ts has no tables yet.

services:
  # ---------------------------------------------------------------------
  # Shared infrastructure
  # ---------------------------------------------------------------------

  nats:
    image: docker.io/library/nats:2-alpine
    command: ["-js", "-m", "8222"] # enable JetStream (ADR-023) + HTTP monitoring
    ports:
      - "4222:4222" # client connections
      - "8222:8222" # HTTP monitoring endpoint

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: dd
      POSTGRES_PASSWORD: dd
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/compose/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ---------------------------------------------------------------------
  # Applications (one per runtime, ADR-027)
  # ---------------------------------------------------------------------

  api-go:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: postgres://dd:dd@postgres:5432/api_go?sslmode=disable
      NATS_URL: nats://nats:4222
      COMPETENCY_SERVICE_URL: http://api-ts:4000
      IDENTITY_SERVICE_URL: http://api-ts:4000
      NOTIFICATION_SERVICE_URL: http://api-ts:4000
    depends_on:
      - nats
      - postgres

  api-ts:
    build:
      context: .
      dockerfile: apps/api-ts/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://dd:dd@postgres:5432/api_ts
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
      - postgres

volumes:
  pgdata:
