openapi: 3.1.0
info:
  title: delegation-service
  version: 0.0.0
  description: >
    Owns liquid-democracy delegation creation, revocation, and chain
    resolution feeding the voting pipeline (SRV-010,
    .spec/technical/services/srv-010.md). Business endpoints are added as
    the corresponding data processes (see .spec/technical/data-processes/) are
    implemented; only the health contract is defined so far.
servers:
  - url: /delegation
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
