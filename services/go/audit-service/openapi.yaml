openapi: 3.1.0
info:
  title: audit-service
  version: 0.0.0
  description: >
    Owns the append-only, hash-chained public audit log -- the highest
    write fan-in of any service (SRV-012, .spec/technical/services/srv-012.md).
    Business endpoints are added as the corresponding data processes
    (see .spec/technical/data-processes/) are implemented; only the health contract
    is defined so far.
servers:
  - url: /audit
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
