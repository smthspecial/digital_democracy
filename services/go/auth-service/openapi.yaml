openapi: 3.1.0
info:
  title: auth-service
  version: 0.1.0
  description: >
    Owns session lifecycle, MFA factor management, and step-up authentication
    used by every other service (SRV-017, .spec/technical/services/srv-017.md).
    Implements DP-059 (login/logout/refresh), DP-060 (factor enrollment),
    DP-061 (step-up MFA), and DP-067 (expired session purge). In-memory store;
    no live identity-service/KMS/audit-service integration (see README.md).
servers:
  - url: /auth
paths:
  /auth/login:
    post:
      operationId: login
      summary: DP-059 — issue a session (T1); reports whether step-up is required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizen_id, citizen_status, credential_valid, device_fingerprint, ip_subnet]
              properties:
                citizen_id:
                  type: string
                citizen_status:
                  type: string
                  enum: [active, pending, suspended, revoked]
                  description: >
                    Trusted as explicit input; a real deployment looks this up
                    from identity-service instead.
                credential_valid:
                  type: boolean
                  description: Trusted as explicit input in this phase (see citizen_status).
                device_fingerprint:
                  type: string
                ip_subnet:
                  type: string
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Session"
                  - type: object
                    properties:
                      requires_step_up:
                        type: boolean
                      available_factor_types:
                        type: array
                        items:
                          type: string
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials, or suspended/revoked citizen (no detail leak)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Citizen status is pending — complete identity verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: DP-059 — revoke a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/refresh:
    post:
      operationId: refresh
      summary: DP-059 — rotate the refresh token; downgrades tier after 12h without MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_fingerprint, ip_subnet]
              properties:
                refresh_token:
                  type: string
                  description: >
                    Would be an httpOnly cookie in a real client-facing
                    deployment; accepted as a body field since there is no
                    cookie-issuing layer in front of this API yet.
                device_fingerprint:
                  type: string
                ip_subnet:
                  type: string
      responses:
        "200":
          description: Rotated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: >
            Unknown/expired token, or device fingerprint / IP subnet mismatch
            or token reuse (both suspend the session as an anomaly)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/factors:
    post:
      operationId: enrollFactor
      summary: DP-060 — enroll a TOTP, passkey, or facial MFA factor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollFactorRequest"
      responses:
        "200":
          description: Factor enrolled; the session's assurance tier is upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAFactor"
        "400":
          description: Missing/invalid proof material for the chosen factor type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Proof verification failed (bad TOTP code, signature, or biometric match)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session does not belong to this citizen, or liveness check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/stepup:
    post:
      operationId: completeStepUp
      summary: DP-061 — verify an MFA proof and raise the session's assurance tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequest"
      responses:
        "200":
          description: Tier raised; a freshly issued access token is included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid tier/factor combination (e.g. T3 requested via totp)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Proof verification failed; after 5 failures within 10 minutes the
            session is additionally suspended (anomaly_reason=mfa_brute_force)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: No active factor of the requested type is enrolled, or the session is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/internal/validate:
    post:
      operationId: validateAccessToken
      summary: Internal — hash-lookup access token validation, called by every other service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token:
                  type: string
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Token is invalid, expired, or the session is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/internal/revoke-all/{citizenID}:
    post:
      operationId: revokeAllSessions
      summary: Internal — forced revocation, consumed only by identity-service (DP-042/DP-035)
      parameters:
        - name: citizenID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Number of sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
  /auth/internal/purge-sessions:
    post:
      operationId: purgeExpiredSessions
      summary: DP-067 (hourly cron) — delete naturally expired, never-revoked sessions
      responses:
        "200":
          description: Number of sessions purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Session:
      type: object
      description: >
        access_token/refresh_token are transient — present only on the
        response from login/refresh/stepup, never persisted or echoed back on
        internal/validate.
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        id:
          type: string
        citizen_id:
          type: string
        device_fingerprint:
          type: string
        ip_subnet:
          type: string
        assurance_tier:
          type: string
          enum: [T1, T2, T3]
        last_mfa_at:
          type: string
          format: date-time
        last_refresh_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, suspended, revoked]
        created_at:
          type: string
          format: date-time
    MFAFactor:
      type: object
      properties:
        id:
          type: string
        citizen_id:
          type: string
        factor_type:
          type: string
          enum: [totp, passkey, facial]
        status:
          type: string
          enum: [active, revoked]
        passkey_credential_id:
          type: string
        enrolled_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    EnrollFactorRequest:
      type: object
      required: [citizen_id, session_id, factor_type]
      properties:
        citizen_id:
          type: string
        session_id:
          type: string
        factor_type:
          type: string
          enum: [totp, passkey, facial]
        totp_secret:
          type: string
          description: totp only — base32 secret (no separate "begin enrollment" round trip in this phase)
        totp_code:
          type: string
          description: totp only — 6-digit confirmation code
        passkey_credential_id:
          type: string
          description: passkey only
        passkey_public_key:
          type: string
          contentEncoding: base64
          description: passkey only — PKIX DER-encoded ECDSA P-256 public key
        passkey_challenge:
          type: string
          contentEncoding: base64
          description: passkey only
        passkey_signature:
          type: string
          contentEncoding: base64
          description: passkey only — ASN.1 signature over sha256(passkey_challenge)
        embedding:
          type: array
          items:
            type: number
          description: facial only — submitted embedding
        reference_embedding:
          type: array
          items:
            type: number
          description: facial only — stands in for the DP-002 identity-verification capture
        liveness:
          type: boolean
          description: facial only — rejected outright when false, regardless of embedding match
    StepUpRequest:
      type: object
      required: [session_id, tier, factor_type]
      properties:
        session_id:
          type: string
        tier:
          type: string
          enum: [T2, T3]
        factor_type:
          type: string
          enum: [totp, passkey, facial]
        totp_code:
          type: string
        passkey_challenge:
          type: string
          contentEncoding: base64
        passkey_signature:
          type: string
          contentEncoding: base64
        embedding:
          type: array
          items:
            type: number
        liveness:
          type: boolean
