openapi: 3.1.0
info:
  title: voting-service
  version: 0.0.0
  description: >
    Ballot cryptography, eligibility tokens, and tallying (SRV-008,
    .spec/technical/services/srv-008.md). Business endpoints are added as
    the corresponding data processes (DP-016, DP-025, DP-026, ...) are
    implemented; only the health contract is defined so far.
servers:
  - url: /voting
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
