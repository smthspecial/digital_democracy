openapi: 3.1.0
info:
  title: jurisdiction-service
  version: 0.1.0
  description: >
    Owns the jurisdiction hierarchy, residency records, and citizen-jurisdiction
    memberships underlying the sphere-of-impact eligibility model (SRV-002,
    .spec/technical/services/srv-002.md). In-memory implementation of jurisdiction
    creation and tree reads, scope-level changes (gated by protocol-layer approval,
    DP-035), residency and membership recording, and the sync eligibility/residency
    checks consumed by voting-service (DP-025).
servers:
  - url: /jurisdiction
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
  /jurisdictions:
    post:
      operationId: createJurisdiction
      summary: Create a jurisdiction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJurisdictionRequest"
      responses:
        "201":
          description: Jurisdiction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"
        "400":
          $ref: "#/components/responses/Error"
  /jurisdictions/{id}/tree:
    get:
      operationId: getJurisdictionTree
      summary: Read a jurisdiction and all its descendants, nested
      parameters:
        - $ref: "#/components/parameters/JurisdictionID"
      responses:
        "200":
          description: The jurisdiction tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionTreeNode"
        "404":
          $ref: "#/components/responses/Error"
  /jurisdictions/{id}/scope-level:
    post:
      operationId: changeScopeLevel
      summary: >
        Change a jurisdiction's scope_level. Requires protocol-layer approval
        (DP-035); 403 when the approval gate rejects it.
      parameters:
        - $ref: "#/components/parameters/JurisdictionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_level]
              properties:
                scope_level:
                  $ref: "#/components/schemas/ScopeLevel"
      responses:
        "200":
          description: Scope level changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          description: Not approved for this scope-level change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          $ref: "#/components/responses/Error"
  /residencies:
    post:
      operationId: createResidency
      summary: Record a citizen's residency period in a jurisdiction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResidencyRequest"
      responses:
        "201":
          description: Residency recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Residency"
        "400":
          $ref: "#/components/responses/Error"
  /residency/verify:
    get:
      operationId: verifyResidency
      summary: >
        Whether the citizen had current residency in the jurisdiction at the
        given instant (defaults to now). FR-012 check on demand.
      parameters:
        - name: citizen_id
          in: query
          required: true
          schema:
            type: string
        - name: jurisdiction_id
          in: query
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: false
          description: ISO 8601 instant; defaults to now
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
  /memberships:
    post:
      operationId: createMembership
      summary: >
        Record a citizen's membership in a jurisdiction. Unique on
        (citizen_id, jurisdiction_id); a citizen may hold simultaneous
        memberships across nested jurisdictions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipRequest"
      responses:
        "201":
          description: Membership recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: Membership already exists for this citizen and jurisdiction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    get:
      operationId: listMemberships
      summary: List a citizen's memberships
      parameters:
        - name: citizen_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The citizen's memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/Error"
  /eligibility:
    get:
      operationId: checkEligibility
      summary: >
        DP-025 sync eligibility check: whether the citizen holds both a
        membership and a sufficiently long current residency in
        scope_jurisdiction_id or one of its descendants.
      parameters:
        - name: citizen_id
          in: query
          required: true
          schema:
            type: string
        - name: scope_jurisdiction_id
          in: query
          required: true
          schema:
            type: string
        - name: min_residency_days
          in: query
          required: false
          description: Defaults to 30 when omitted
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Eligibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResult"
        "400":
          $ref: "#/components/responses/Error"
components:
  parameters:
    JurisdictionID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
    ScopeLevel:
      type: string
      enum: [neighborhood, city, region, national]
    JurisdictionStatus:
      type: string
      enum: [active, under_review]
    Jurisdiction:
      type: object
      properties:
        id:
          type: string
        parent_id:
          type: string
          nullable: true
        name:
          type: string
        scope_level:
          $ref: "#/components/schemas/ScopeLevel"
        boundary_ref:
          type: string
        status:
          $ref: "#/components/schemas/JurisdictionStatus"
    JurisdictionTreeNode:
      allOf:
        - $ref: "#/components/schemas/Jurisdiction"
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/JurisdictionTreeNode"
    CreateJurisdictionRequest:
      type: object
      required: [name, scope_level, boundary_ref]
      properties:
        parent_id:
          type: string
          nullable: true
        name:
          type: string
        scope_level:
          $ref: "#/components/schemas/ScopeLevel"
        boundary_ref:
          type: string
          description: Immutable pointer to an externally published boundary definition (ADR-004)
    ResidencyStatus:
      type: string
      enum: [active, ended]
    Residency:
      type: object
      properties:
        id:
          type: string
        citizen_id:
          type: string
        jurisdiction_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        verified:
          type: boolean
        status:
          $ref: "#/components/schemas/ResidencyStatus"
    CreateResidencyRequest:
      type: object
      required: [citizen_id, jurisdiction_id, start_date]
      properties:
        citizen_id:
          type: string
        jurisdiction_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
    Membership:
      type: object
      properties:
        id:
          type: string
        citizen_id:
          type: string
        jurisdiction_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateMembershipRequest:
      type: object
      required: [citizen_id, jurisdiction_id]
      properties:
        citizen_id:
          type: string
        jurisdiction_id:
          type: string
    EligibilityResult:
      type: object
      properties:
        eligible:
          type: boolean
        reasons:
          type: array
          items:
            type: string
