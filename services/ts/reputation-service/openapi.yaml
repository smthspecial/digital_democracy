openapi: 3.1.0
info:
  title: reputation-service
  version: 0.1.0
  description: >
    Owns participation reputation scoring, tracked separately from voting
    weight (SRV-014, .spec/technical/services/srv-014.md). In-memory
    append-only event log: current reputation is the sum of all deltas
    (DP-038).
servers:
  - url: /reputation
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
  /reputation/records:
    post:
      operationId: createReputationRecord
      summary: Record a signed reputation delta (DP-038)
      description: >
        delta's sign must match factor_type's polarity (positive factors:
        accurate_prediction, constructive, disclosure, successful_proposal;
        negative factors: misinformation, undisclosed_conflict,
        manipulation, fraud). A negative-polarity record requires a
        non-empty source_ref identifying the upstream authoritative
        decision that produced it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReputationRecordRequest"
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReputationRecord"
        "400":
          $ref: "#/components/responses/Error"
  /reputation/citizens/{id}:
    get:
      operationId: getCitizenReputation
      summary: Current reputation total and full event log for a citizen
      parameters:
        - $ref: "#/components/parameters/CitizenID"
      responses:
        "200":
          description: Reputation total and records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenReputation"
  /reputation/citizens/{id}/records:
    get:
      operationId: listCitizenReputationRecords
      summary: Full reputation event log for a citizen
      parameters:
        - $ref: "#/components/parameters/CitizenID"
      responses:
        "200":
          description: The citizen's reputation records, in insertion order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReputationRecord"
components:
  parameters:
    CitizenID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
    FactorType:
      type: string
      enum:
        - accurate_prediction
        - constructive
        - disclosure
        - successful_proposal
        - misinformation
        - undisclosed_conflict
        - manipulation
        - fraud
    CreateReputationRecordRequest:
      type: object
      required: [citizen_id, factor_type, delta]
      properties:
        citizen_id:
          type: string
        factor_type:
          $ref: "#/components/schemas/FactorType"
        delta:
          type: number
          description: >
            Sign must match factor_type's polarity; zero is rejected.
        source_ref:
          type: [string, "null"]
          description: Required (non-empty) for negative-polarity factor_types.
    ReputationRecord:
      type: object
      properties:
        id:
          type: string
        citizen_id:
          type: string
        factor_type:
          $ref: "#/components/schemas/FactorType"
        delta:
          type: number
        source_ref:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    CitizenReputation:
      type: object
      properties:
        citizen_id:
          type: string
        total:
          type: number
          description: Sum of all delta values recorded for this citizen.
        records:
          type: array
          items:
            $ref: "#/components/schemas/ReputationRecord"
