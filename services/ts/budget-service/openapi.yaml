openapi: 3.1.0
info:
  title: budget-service
  version: 0.0.0
  description: >
    Owns budget categories, citizen allocation votes, and the public spending
    ledger. (SRV-007, .spec/technical/services/srv-007.md).
servers:
  - url: /budget
paths:
  /budget/categories:
    post:
      operationId: createBudgetCategory
      summary: Create a budget category (DP-013 supporting resource)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCategory"
        "400":
          $ref: "#/components/responses/Error"
  /budget/categories/{jurisdictionId}/tree:
    get:
      operationId: getBudgetCategoryTree
      summary: Get the category hierarchy for a jurisdiction
      parameters:
        - name: jurisdictionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category tree (empty array if jurisdiction has no categories)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryTreeNode"
  /budget/allocations:
    post:
      operationId: submitBudgetAllocations
      summary: Submit a citizen's full allocation set for a period (DP-013)
      description: >
        Percentages across all categories for the same citizen+period must sum
        to exactly 100 (400 with the actual sum otherwise). Replaces any prior
        rows this citizen had for that period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAllocationsRequest"
      responses:
        "201":
          description: Allocation votes recorded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetAllocationVote"
        "400":
          $ref: "#/components/responses/Error"
  /budget/allocations/aggregate:
    post:
      operationId: aggregateBudgetAllocations
      summary: Aggregate a period's allocation votes into allocated amounts (DP-051)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, total_pool]
              properties:
                period:
                  type: string
                total_pool:
                  type: number
                  description: >
                    Total budget pool for this period. There is no separate
                    "total available budget" table in this service's schema,
                    so it is an explicit input to aggregation.
      responses:
        "200":
          description: Per-category aggregation results (only categories with at least one vote)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllocationAggregateResult"
  /budget/ledger:
    post:
      operationId: recordLedgerEntry
      summary: Append an immutable ledger entry (DP-019)
      description: >
        Append-only. No update or delete route exists, ever; corrections are
        new compensating entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordLedgerEntryRequest"
      responses:
        "201":
          description: Ledger entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "400":
          $ref: "#/components/responses/Error"
    get:
      operationId: listLedgerEntries
      summary: Public ledger listing
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
  /budget/reconcile:
    post:
      operationId: reconcileLedger
      summary: Reconcile ledger outflows against allocated amounts (DP-055)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                  description: Informational only; reconciliation covers all recorded data.
      responses:
        "200":
          description: Per-category reconciliation results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReconciliationResult"
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
  schemas:
    BudgetCategory:
      type: object
      properties:
        id:
          type: string
        jurisdictionId:
          type: string
        parentId:
          type: [string, "null"]
        name:
          type: string
        allocatedAmount:
          type: number
        createdAt:
          type: string
          format: date-time
    CategoryTreeNode:
      allOf:
        - $ref: "#/components/schemas/BudgetCategory"
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/CategoryTreeNode"
    CreateCategoryRequest:
      type: object
      required: [jurisdiction_id, name]
      properties:
        jurisdiction_id:
          type: string
        parent_id:
          type: [string, "null"]
        name:
          type: string
    BudgetAllocationVote:
      type: object
      properties:
        id:
          type: string
        citizenId:
          type: string
        categoryId:
          type: string
        percentage:
          type: number
        period:
          type: string
        createdAt:
          type: string
          format: date-time
    SubmitAllocationsRequest:
      type: object
      required: [citizen_id, period, allocations]
      properties:
        citizen_id:
          type: string
        period:
          type: string
        allocations:
          type: array
          minItems: 1
          items:
            type: object
            required: [category_id, percentage]
            properties:
              category_id:
                type: string
              percentage:
                type: number
    AllocationAggregateResult:
      type: object
      properties:
        categoryId:
          type: string
        averagePercentage:
          type: number
        voteCount:
          type: integer
        allocatedAmount:
          type: number
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
        categoryId:
          type: [string, "null"]
        type:
          type: string
          enum: [inflow, outflow]
        amount:
          type: number
        description:
          type: string
        recordedBy:
          type: string
        createdAt:
          type: string
          format: date-time
    RecordLedgerEntryRequest:
      type: object
      required: [type, amount, description, recorded_by]
      properties:
        category_id:
          type: [string, "null"]
        type:
          type: string
          enum: [inflow, outflow]
        amount:
          type: number
        description:
          type: string
        recorded_by:
          type: string
    ReconciliationResult:
      type: object
      properties:
        categoryId:
          type: string
        allocated:
          type: number
        spent:
          type: number
        discrepancy:
          type: number
