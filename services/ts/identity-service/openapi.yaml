openapi: 3.1.0
info:
  title: identity-service
  version: 0.0.0
  description: >
    Owns civic identity records and verification (SRV-001,
    .spec/technical/services/srv-001.md). Implements the civic identity
    lifecycle (DP-001, DP-002, DP-024, DP-042, DP-056) plus the health
    contract.
servers:
  - url: /identity
paths:
  /identity/citizens:
    post:
      operationId: registerCitizen
      summary: Register a civic identity (DP-001)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCitizenRequest"
      responses:
        "201":
          description: Citizen created with status=pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: A citizen with this legal identity already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listCitizens
      summary: List citizens
      responses:
        "200":
          description: All registered citizens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Citizen"
  /identity/citizens/{id}:
    get:
      operationId: getCitizen
      summary: Get a citizen by id
      parameters:
        - $ref: "#/components/parameters/CitizenId"
      responses:
        "200":
          description: The citizen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "404":
          $ref: "#/components/responses/Error"
  /identity/citizens/{id}/verifications:
    post:
      operationId: submitVerification
      summary: Submit identity verification evidence (DP-002)
      parameters:
        - $ref: "#/components/parameters/CitizenId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVerificationRequest"
      responses:
        "201":
          description: >
            Verification recorded. If this is the citizen's first
            status=verified record, the citizen is activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerification"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /identity/citizens/{id}/suspend:
    post:
      operationId: suspendCitizen
      summary: Suspend a citizen (requires multi-approval)
      parameters:
        - $ref: "#/components/parameters/CitizenId"
      responses:
        "200":
          description: Citizen suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "403":
          description: Required multi-approval has not been granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/Error"
  /identity/citizens/{id}/revoke:
    post:
      operationId: revokeCitizen
      summary: Revoke a citizen's identity (DP-042, requires multi-approval)
      parameters:
        - $ref: "#/components/parameters/CitizenId"
      responses:
        "200":
          description: Citizen revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Citizen"
        "403":
          description: Required multi-approval has not been granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/Error"
  /identity/duplicates/scan:
    post:
      operationId: scanDuplicateIdentities
      summary: Run the duplicate identity detector (DP-024 / DP-056)
      responses:
        "200":
          description: Flagged duplicate groups and signal matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateScanResult"
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
components:
  parameters:
    CitizenId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    RegisterCitizenRequest:
      type: object
      required: [public_handle, raw_legal_identifier]
      properties:
        public_handle:
          type: string
          description: Non-identifying public participation handle
        raw_legal_identifier:
          type: string
          description: >
            Government identifier submitted once at registration; hashed
            (salted) into legal_identity_hash and discarded immediately.
            Never stored or returned.
    Citizen:
      type: object
      description: Never includes raw_legal_identifier or any salt/pepper material.
      properties:
        id:
          type: string
          format: uuid
        public_handle:
          type: string
        status:
          type: string
          enum: [pending, active, suspended, revoked]
        created_at:
          type: string
          format: date-time
    SubmitVerificationRequest:
      type: object
      description: >
        A real deployment runs a document/liveness verification pipeline
        here; this service accepts its outcome as an explicit input instead
        of performing verification itself.
      required: [evidence_ref, outcome]
      properties:
        evidence_ref:
          type: string
          description: Encrypted reference to verification evidence
        outcome:
          type: string
          enum: [verified, rejected]
        method:
          type: string
          enum: [national_id, passport, gov_credential]
          default: gov_credential
    IdentityVerification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        citizen_id:
          type: string
          format: uuid
        method:
          type: string
          enum: [national_id, passport, gov_credential]
        evidence_ref:
          type: string
        status:
          type: string
          enum: [verified, rejected]
        verified_at:
          type: string
          format: date-time
          nullable: true
    DuplicateScanResult:
      type: object
      properties:
        hash_matches:
          type: array
          description: Citizens sharing an exact legal_identity_hash
          items:
            type: object
            properties:
              legal_identity_hash:
                type: string
              citizen_ids:
                type: array
                items:
                  type: string
                  format: uuid
        signal_matches:
          type: array
          description: Citizen pairs flagged by the injectable DuplicateSignal heuristic
          items:
            type: object
            properties:
              citizen_id_a:
                type: string
                format: uuid
              citizen_id_b:
                type: string
                format: uuid
