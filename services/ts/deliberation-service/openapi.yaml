openapi: 3.1.0
info:
  title: deliberation-service
  version: 0.0.0
  description: >
    Owns deliberation arguments and preference declarations, and triggers
    AI-assisted synthesis (SRV-006, .spec/technical/services/srv-006.md).
servers:
  - url: /deliberation
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
  /arguments:
    post:
      operationId: postArgument
      summary: Post a threaded, evidence-linked deliberation argument (DP-008)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostArgumentRequest"
      responses:
        "201":
          description: Argument created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Argument"
        "400":
          description: Missing/invalid field (e.g. evidence_ref absent) or invalid stance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: parent_id does not reference an existing argument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: parent_id's subtree is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /arguments/{id}/lock:
    post:
      operationId: lockArgument
      summary: Lock an agreement-stance argument's branch to prevent re-litigation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Argument locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Argument"
        "400":
          description: The argument's stance is not "agreement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such argument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /proposals/{proposalId}/arguments:
    get:
      operationId: listArgumentsByProposal
      summary: >
        Flat list of a proposal's arguments (parent_id included), sorted by
        created_at. Clients reconstruct the reply tree client-side.
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Arguments for the proposal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Argument"
  /preferences:
    post:
      operationId: declarePreference
      summary: Declare a citizen's desired outcome for a problem (DP-009)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPreferenceRequest"
      responses:
        "201":
          description: Preference created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preference"
        "400":
          description: Missing/invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /problems/{problemId}/preferences:
    get:
      operationId: listPreferencesByProblem
      summary: List a problem's declared preferences, sorted by created_at
      parameters:
        - name: problemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preferences for the problem
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preference"
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    PostArgumentRequest:
      type: object
      required: [proposal_id, citizen_id, content, evidence_ref, stance]
      properties:
        proposal_id:
          type: string
        citizen_id:
          type: string
        parent_id:
          type: [string, "null"]
        content:
          type: string
        evidence_ref:
          type: string
        stance:
          type: string
          enum: [agreement, disagreement]
    Argument:
      type: object
      properties:
        id:
          type: string
        proposal_id:
          type: string
        citizen_id:
          type: string
        parent_id:
          type: [string, "null"]
        content:
          type: string
        evidence_ref:
          type: string
        stance:
          type: string
          enum: [agreement, disagreement]
        locked:
          type: boolean
        created_at:
          type: string
          format: date-time
    PostPreferenceRequest:
      type: object
      required: [problem_id, citizen_id, description]
      properties:
        problem_id:
          type: string
        citizen_id:
          type: string
        description:
          type: string
    Preference:
      type: object
      properties:
        id:
          type: string
        problem_id:
          type: string
        citizen_id:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
