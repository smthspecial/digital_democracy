openapi: 3.1.0
info:
  title: ai-synthesis-service
  version: 0.0.0
  description: >
    Owns AI-assisted deliberation synthesis; advisory and non-authoritative
    only (SRV-016, .spec/technical/services/srv-016.md). Implements DP-037
    (AI policy synthesis): every output carries a mandatory, non-removable
    "AI-generated analysis" label and model provenance, and the service has
    no write access to any governance table.
servers:
  - url: /ai-synthesis
paths:
  /ai-synthesis/synthesize:
    post:
      operationId: synthesize
      summary: Run rule-based AI synthesis over arguments/preferences (DP-037)
      description: >
        Accepts arguments/preferences directly (there is no live read from
        deliberation-service yet). While the service is disabled, returns
        `{ disabled: true }` without storing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SynthesizeRequest"
      responses:
        "200":
          description: Either the stored synthesis output, or a disabled marker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SynthesisOutput"
                  - $ref: "#/components/schemas/DisabledResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-synthesis/toggle:
    post:
      operationId: toggleSynthesis
      summary: Enable or disable the AI synthesis service (protocol-layer decision)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Current enabled state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
  /ai-synthesis/outputs/{id}/flag:
    post:
      operationId: flagSynthesisOutput
      summary: Flag a synthesis output as biased/misleading
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizen_id, reason]
              properties:
                citizen_id:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: The updated (flagged) synthesis output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesisOutput"
        "404":
          description: No such synthesis output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-synthesis/outputs/{id}:
    get:
      operationId: getSynthesisOutput
      summary: Get a synthesis output by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The synthesis output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynthesisOutput"
        "404":
          description: No such synthesis output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-synthesis/proposals/{proposalId}/outputs:
    get:
      operationId: listSynthesisOutputsForProposal
      summary: List all synthesis outputs produced for a proposal
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Synthesis outputs for the proposal (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SynthesisOutput"
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
components:
  schemas:
    Stance:
      type: string
      enum: [agreement, disagreement]
    ArgumentInput:
      type: object
      required: [content, stance]
      properties:
        content:
          type: string
        stance:
          $ref: "#/components/schemas/Stance"
        evidence_ref:
          type: string
    PreferenceInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
    SynthesizeRequest:
      type: object
      required: [proposal_id, arguments, preferences]
      properties:
        proposal_id:
          type: string
        arguments:
          type: array
          items:
            $ref: "#/components/schemas/ArgumentInput"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/PreferenceInput"
    DisabledResponse:
      type: object
      properties:
        disabled:
          type: boolean
          const: true
    SharedObjective:
      type: object
      properties:
        description:
          type: string
        count:
          type: integer
    Conflict:
      type: object
      properties:
        argument_id_a:
          type: string
        argument_id_b:
          type: string
        overlapping_terms:
          type: array
          items:
            type: string
    AlternativeFraming:
      type: object
      properties:
        stance:
          $ref: "#/components/schemas/Stance"
        framing:
          type: string
    TradeoffSignal:
      type: object
      properties:
        keyword:
          type: string
        frequency:
          type: integer
    FlagReason:
      type: object
      properties:
        citizen_id:
          type: string
        reason:
          type: string
        flagged_at:
          type: string
          format: date-time
    ModelProvenance:
      type: object
      properties:
        model_name:
          type: string
        version:
          type: string
        training_data_summary:
          type: string
    SynthesisOutput:
      type: object
      description: >
        Always carries the mandatory, non-removable AI-generated-analysis
        label and model provenance (see serializeSynthesisOutput).
      properties:
        id:
          type: string
        proposal_id:
          type: string
        created_at:
          type: string
          format: date-time
        arguments:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ArgumentInput"
              - type: object
                properties:
                  id:
                    type: string
        shared_objectives:
          type: array
          items:
            $ref: "#/components/schemas/SharedObjective"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/Conflict"
        alternative_framings:
          type: array
          items:
            $ref: "#/components/schemas/AlternativeFraming"
        tradeoffs:
          type: array
          items:
            $ref: "#/components/schemas/TradeoffSignal"
        flagged:
          type: boolean
        flag_reasons:
          type: array
          items:
            $ref: "#/components/schemas/FlagReason"
        label:
          type: string
          const: "AI-generated analysis — advisory only, subject to human review."
        model_provenance:
          $ref: "#/components/schemas/ModelProvenance"
    Error:
      type: object
      properties:
        error:
          type: string
