port: 4222
http_port: 8222
max_payload: 65536
jetstream { store_dir: /data/jetstream, max_memory_store: 64MB, max_file_store: 1GB }
authorization {
 users: [{ user: "api-go", password: $NATS_API_GO_PASSWORD,
   permissions: {
     publish: { allow: ["audit.append", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"] },
     subscribe: { allow: ["audit.append", "_INBOX.>"] }
   }
 }]
}
