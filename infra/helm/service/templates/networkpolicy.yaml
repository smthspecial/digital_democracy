{{/*
Default-deny with an explicit allow-list, per ADR-018. Every service may
always reach audit-service and notification-service (arch-005 integrity
bus); anything else must be listed in .Values.allowedEgress.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {} # refined per-namespace by the mesh AuthorizationPolicy (ADR-018); this is the coarse NetworkPolicy backstop
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit-service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-service
    {{- range .Values.allowedEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
    {{- end }}
    - to: # DNS
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
