{{- if .Values.route.prefix }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.prefix }}
      backendRefs:
        - name: {{ include "service.fullname" . }}
          port: 80
{{- end }}
