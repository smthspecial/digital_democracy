# Defaults shared by every service. A service's values file under
# infra/helm/values/<name>.yaml overrides only what differs.

name: ""
releaseId: ""
lang: "" # ts | go -- used only for labeling/image path convention
image:
  repository: ""
  tag: "dev"
  digest: "" # releases use sha256 digests, never mutable tags
  pullPolicy: IfNotPresent

port: 8080 # every service listens on 8080 inside its container (README.md)
route:
  prefix: "" # e.g. /voting -- used by the HTTPRoute template

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# ADR-026: a node drain must never evict every replica of a service at once.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Additional per-service edges this service is allowed to call, per the
# arch-005 producer/consumer table -- rendered into the NetworkPolicy so
# the mesh's default-deny posture (ADR-018) has an explicit allow-list.
allowedEgress: []
# - service-name

serviceAccount:
  create: true

gatewayName: dd-gateway # the shared Gateway API Gateway resource this service's HTTPRoute attaches to

# Explicit caller namespaces and pod identities; empty means deny ingress.
allowedIngress:
  - namespace: kube-system
    name: traefik
    publicGateway: true
# - namespace: kube-system
#   name: traefik

envSecret: ""
configEnv: {}
secretVolumes: [] # mount workload-specific TLS material, never migration credentials
mesh:
  enabled: true
allowedDependencies: []

gatewayNamespace: kube-system
gatewayServiceAccount: traefik
publicMutations: []
internalReadPaths: [] # signed worker reads must also be excluded from gateway GET access
