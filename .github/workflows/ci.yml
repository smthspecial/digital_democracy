name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    # Postgres backs apps/api-ts's *.service.spec.ts / *.controller.e2e.spec.ts
    # tier (BUG-004/TI-02): before this, those 264+ tests never executed in
    # CI at all (describe.skipIf(!urls) silently skipped the whole tier --
    # `Tests 2 passed | 262 skipped` on every run, green). REQUIRE_DB_TESTS
    # below converts a missing/misconfigured var back into a hard failure
    # rather than a silent return to that state.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dd
          POSTGRES_PASSWORD: dd
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency security regressions and advisory scan
        run: |
          node --test testing/security/dependency-policy.test.mjs
          node --test testing/security/mobile-bundle-audit.test.mjs
          pnpm test:security-dependencies
      - name: Inspect mobile runtime dependency exposure
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          pnpm --filter @dd/mobile exec expo export --platform android --platform ios --source-maps --max-workers 2 --output-dir "$RUNNER_TEMP/mobile-export"
          node testing/security/mobile-bundle-audit.mjs "$RUNNER_TEMP/mobile-export" "$RUNNER_TEMP/mobile-bundle-report.json"
      - name: Retain mobile dependency exposure evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dependency-exposure
          path: ${{ runner.temp }}/mobile-bundle-report.json
          if-no-files-found: error
      - name: Release and image gate regressions
        run: python3 -m unittest discover -s testing/production-readiness -v

      # Required before lint/typecheck/test/build even run: `@prisma/client`
      # ships as an unresolvable stub (`.prisma/client/default`) until
      # `prisma generate` writes the real generated client into
      # node_modules -- a plain `pnpm install` does not do this on its own
      # (no postinstall hook triggers it). No database connection needed for
      # this step; it only reads prisma/schema.prisma.
      - name: Generate Prisma Client
        working-directory: apps/api-ts
        env:
          MIGRATE_DATABASE_URL: postgres://unused:unused@localhost:5432/unused
        run: pnpm exec prisma generate

      - name: Create api_ts database
        run: PGPASSWORD=dd psql -h localhost -U dd -d postgres -c "CREATE DATABASE api_ts"

      - name: Apply api-ts Prisma migrations (creates api_app/api_worker roles too)
        working-directory: apps/api-ts
        env:
          MIGRATE_DATABASE_URL: postgres://dd:dd@localhost:5432/api_ts
        run: pnpm exec prisma migrate deploy

      - name: Lint, typecheck, test, build
        env:
          # Deliberately TEST_TS_* -- see test-support/postgres.ts's header
          # comment on why this must not collide with the go job's
          # unprefixed TEST_DATABASE_URL for a different database.
          TEST_TS_DATABASE_URL: postgres://api_app:api_app_dev@localhost:5432/api_ts
          TEST_TS_WORKER_DATABASE_URL: postgres://api_worker:api_worker_dev@localhost:5432/api_ts
          TEST_TS_ADMIN_DATABASE_URL: postgres://dd:dd@localhost:5432/api_ts
          REQUIRE_DB_TESTS: "1"
          IDENTITY_HASH_SECRET: ci-test-secret
        run: pnpm turbo run lint typecheck test build

      - name: Check test floor (TI-04)
        # Defense-in-depth alongside REQUIRE_DB_TESTS above: catches a
        # *newly re-skipped* test file (a fresh skipIf/it.skip) rather than
        # a missing env var -- a suite that quietly shrinks back toward
        # "2 passed" without ever reporting red. 250 is a floor below the
        # true baseline (291 as of this fix), not the current count, so
        # adding tests doesn't require bumping this number every time.
        run: |
          node -e '
            const r = require("./apps/api-ts/vitest-report.json");
            const floor = 250;
            console.log(`vitest: ${r.numPassedTests}/${r.numTotalTests} passed`);
            if (!r.success) { console.error("vitest reported failures"); process.exit(1); }
            if (r.numPassedTests < floor) {
              console.error(`only ${r.numPassedTests} tests ran, want >= ${floor} -- a test tier likely got silently skipped again`);
              process.exit(1);
            }
          '

  go:
    name: Go (vet, test, build)
    runs-on: ubuntu-latest
    # Postgres backs apps/api-go's pgstore_test.go tier (audit, auth,
    # delegation, voting -- ARCH-027 pattern #7): before this, the job set
    # no TEST_DATABASE_URL, so every one of those tests silently skipped on
    # every PR -- the same shape BUG-004/TI-02 already fixed for the `ts`
    # job above. REQUIRE_DB_TESTS converts a missing/misconfigured var back
    # into a hard failure rather than a silent return to that state.
    # packages/go/eventbus doesn't read these vars at all -- harmless there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dd
          POSTGRES_PASSWORD: dd
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        # Matches Makefile's GO_MODULES -- the single source of truth for
        # which Go modules exist post-ADR-027 (BUG-002: the previous
        # 4-service matrix here pointed at services/go/<svc>, deleted by
        # the pivot commit; this job silently built nothing for eight days).
        module: [apps/api-go, packages/go/eventbus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # Both modules' nats_test.go/eventbus_test.go (ADR-023) spawn a real
      # nats-server; not preinstalled on the runner image.
      - run: go install github.com/nats-io/nats-server/v2@latest
      - working-directory: ${{ matrix.module }}
        env:
          # TI-04: a skip here means the install step above broke, not that
          # NATS is legitimately unavailable -- must fail loudly.
          REQUIRE_NATS_TESTS: "1"
          # Self-migrating (apps/api-go's own pg.Up runs at test time) -- no
          # separate "create database"/migrate step needed, unlike the `ts`
          # job's Prisma-owned schema.
          TEST_DATABASE_URL: postgres://dd:dd@localhost:5432/postgres?sslmode=disable
          REQUIRE_DB_TESTS: "1"
        run: |
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go test ./...
          go build ./...

      # Browser automation and the fake identity checker are test-only. This
      # exercises navigator.credentials with real auth handlers + Postgres.
      - uses: pnpm/action-setup@v4
        if: matrix.module == 'apps/api-go'
      - uses: actions/setup-node@v4
        if: matrix.module == 'apps/api-go'
        with:
          node-version: 24
          cache: pnpm
      - name: Install browser test dependencies
        if: matrix.module == 'apps/api-go'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: matrix.module == 'apps/api-go'
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser passkey ceremonies (memory and Postgres)
        if: matrix.module == 'apps/api-go'
        env:
          TEST_DATABASE_URL: postgres://dd:dd@localhost:5432/postgres?sslmode=disable
          REQUIRE_DB_TESTS: "1"
        run: pnpm test:passkeys

  cryptography:
    name: Experimental blind credentials (RFC 9474)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testing/cryptography
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: testing/cryptography/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -mod=readonly -race -count=1 ./... github.com/cloudflare/circl/blindsign/blindrsa

  docker:
    name: Image build and security scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [ts, go]
    strategy:
      matrix:
        include:
          - { app: api-go, image: api-go, target: "" }
          - { app: api-ts, image: api-ts, target: "" }
          - { app: api-ts, image: api-ts-migration, target: migration }
          - { app: web, image: web, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: digital-democracy/${{ matrix.image }}:ci
      - name: Install pinned scanner
        run: infra/release/install-trivy.sh "$RUNNER_TEMP/trivy"
      - name: Scan exact image
        env:
          IMAGE: digital-democracy/${{ matrix.image }}:ci
        run: |
          mkdir -p image-evidence
          docker inspect "$IMAGE" > image-evidence/identity.json
          "$RUNNER_TEMP/trivy/trivy" --version > image-evidence/scanner-version.txt
          "$RUNNER_TEMP/trivy/trivy" image --scanners vuln --format json --output image-evidence/scan.json --timeout 10m "$IMAGE"
          python3 infra/release/image-gate.py image-evidence/scan.json --output image-evidence/gate.json
      - name: Retain image evidence including failed gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-${{ matrix.image }}
          path: image-evidence/
          if-no-files-found: error
